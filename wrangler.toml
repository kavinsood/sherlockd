name = "sherlockd"
compatibility_date = "2025-01-01"
main = "worker/src/index.ts"
routes = [{ pattern = "sherlockd.kavinsood.com", custom_domain = true }]

# Build command to run before deployment
[build]
command = "pnpm run build"

# Static assets from SvelteKit build
[assets]
directory = "./build"
not_found_handling = "single-page-application"
binding = "ASSETS"

# Rate limiter binding
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1337"
simple = { limit = 10, period = 60 }

# Kitsune API, served by the kitsune-wasm Worker (kitsune/cmd/kitsune-worker)
[[services]]
binding = "KITSUNE"
service = "kitsune-wasm"

# Environment variables (not secrets)
[vars]
# Only used when the KITSUNE binding is absent, e.g. against a local kitsune-api.
KITSUNE_API_URL = "http://localhost:8080/analyze"
ENVIRONMENT = "production"

